name: Desktop release continuation

on:
  workflow_run:
    workflows: [Rust]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  request:
    name: Identify merged release request
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, clacks-linux]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.request.outputs.branch }}
    steps:
      - name: Look up the release request for the verified commit
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          branch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls" --paginate --slurp |
            jq -r --arg repository "$GITHUB_REPOSITORY" --arg revision "$SOURCE_SHA" '
              first(.[][] | select(
                .merged_at != null and
                .base.ref == "main" and
                .head.repo.full_name == $repository and
                .merge_commit_sha == $revision and
                (.head.ref | startswith("release/desktop-v"))
              ) | .head.ref) // empty
            ')
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          printf 'Merged desktop release request: %s\n' "${branch:-none}"

  continue:
    name: Continue the verified release request
    needs: request
    if: needs.request.outputs.branch != ''
    runs-on: [self-hosted, Linux, X64, clacks-linux]
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_LOG: info
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Use persistent local Cargo build artifacts
        run: printf 'CARGO_TARGET_DIR=%s\n' "$(dirname "$GITHUB_WORKSPACE")/target" >> "$GITHUB_ENV"
      - name: Build source-owned release tooling
        run: |
          cargo fetch --locked
          cargo build -p clacks-desktop-package --locked --offline
      - name: Continue the selected release request
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUEST_BRANCH: ${{ needs.request.outputs.branch }}
        run: >-
          "$CARGO_TARGET_DIR/debug/clacks-desktop-package" release-continue
          --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA"
          --request-branch "$REQUEST_BRANCH"
