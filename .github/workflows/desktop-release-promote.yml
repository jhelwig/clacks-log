name: Desktop release promotion

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Accepted desktop candidate to promote (desktop-vYY.M.N)
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: [self-hosted, Linux, X64, clacks-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use persistent local Cargo build artifacts
        run: printf 'CARGO_TARGET_DIR=%s\n' "$(dirname "$GITHUB_WORKSPACE")/target" >> "$GITHUB_ENV"
      - name: Build release tooling
        run: |
          cargo fetch --locked
          cargo build -p clacks-desktop-package --locked --offline
      - name: Promote the accepted candidate without replacing installers
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.tag }}
          RUST_LOG: info
        run: '"$CARGO_TARGET_DIR/debug/clacks-desktop-package" promote --repository "$GITHUB_REPOSITORY" --tag "$CANDIDATE_TAG"'
