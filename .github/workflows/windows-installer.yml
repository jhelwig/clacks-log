name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  eligibility:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      artifact: ${{ steps.source.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve immutable tagged source
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "artifact=release-eligibility-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-installer-preflight
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Build focused packaging helper
        run: cargo build -p clacks-desktop-package --locked --offline
      - name: Check tag against committed Cargo version
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          cargo metadata --no-deps --format-version 1 --locked --offline > cargo-metadata.json
          target/debug/clacks-desktop-package prepare --platform windows-x64 --metadata cargo-metadata.json --revision "$SOURCE_SHA" --tag "$GITHUB_REF_NAME" --output metadata.json
      - name: Reuse exact-commit Linux and web results
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUST_LOG: info
        run: target/debug/clacks-desktop-package gate --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA" --output ci-evidence.json
      - name: Preserve existing verification identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: |
            ci-evidence.json
            metadata.json
          if-no-files-found: error

  package:
    needs: eligibility
    if: always() && (github.event_name == 'workflow_dispatch' || needs.eligibility.result == 'success')
    runs-on: windows-2025
    env:
      SQLX_OFFLINE: 'true'
      RUST_LOG: info
      # The desktop must not depend on a developer-installed VC runtime.
      # Confirm imports and clean Windows behavior rather than assuming this
      # flag proves every native dependency is supplied by Windows.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      msi: ${{ steps.identity.outputs.name }}
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-installer-msvc-crt-static
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Build Windows packaging helper
        run: cargo build -p clacks-desktop-package --locked --offline
      - name: Test Windows packaging helper
        run: cargo test -p clacks-desktop-packaging --all-targets --locked --offline
      - name: Lint Windows packaging helper
        run: cargo clippy -p clacks-desktop-packaging -p clacks-desktop-package --all-targets --locked --offline -- -D warnings
      - name: Retrieve release eligibility evidence
        if: github.event_name == 'push'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.eligibility.outputs.artifact }}
          path: target/windows-package
      - name: Resolve Windows build identity
        id: identity
        env:
          ELIGIBLE_SHA: ${{ needs.eligibility.outputs.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force target/windows-package/delivery | Out-Null
          $sha = git rev-parse HEAD
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $sha -ne $env:ELIGIBLE_SHA) { throw 'Source differs from eligible commit' }
          cargo metadata --no-deps --format-version 1 --locked --offline | Out-File -Encoding utf8 target/windows-package/cargo-metadata.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $tagArgs = @()
          if ($env:GITHUB_EVENT_NAME -eq 'push') { $tagArgs = @('--tag', $env:GITHUB_REF_NAME) }
          target/debug/clacks-desktop-package.exe prepare --platform windows-x64 --metadata target/windows-package/cargo-metadata.json --revision $sha @tagArgs --output target/windows-package/metadata.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $metadata = Get-Content target/windows-package/metadata.json -Raw | ConvertFrom-Json
          $version = $metadata.version
          $name = "clacks-log-$version-windows-x64.msi"
          if ($env:GITHUB_EVENT_NAME -eq 'push') { $name = "clacks-log-$($env:GITHUB_REF_NAME.Substring(1))-windows-x64.msi" }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $name = "clacks-log-$version-dev-$($sha.Substring(0,7))-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-windows-x64.msi" }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($metadata.prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "artifact=windows-installer-$sha-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
      - name: Build production desktop with Windows resources
        run: cargo build -p clacks-log --release --target x86_64-pc-windows-msvc --locked --offline
      - name: Smoke-check command-line startup without opening a workspace
        run: |
          target/x86_64-pc-windows-msvc/release/clacks-log.exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          target/x86_64-pc-windows-msvc/release/clacks-log.exe --version
      - name: Install pinned notice harvester
        run: cargo install cargo-about --version 0.9.3 --features cli --locked --root target/notice-tool
      - name: Harvest desktop runtime notices
        run: target/notice-tool/bin/cargo-about.exe generate --locked --fail --manifest-path bin/clacks-log/Cargo.toml --config deploy/desktop/windows/about.toml --output-file target/windows-package/THIRD-PARTY-NOTICES.txt deploy/desktop/windows/notices.hbs
      # Future executable signing and signature verification belong here,
      # before msi-builder consumes the final executable bytes.
      # No signing service is configured; current artifacts are unsigned.
      - name: Fetch and verify pinned MSI compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest https://github.com/jkroepke/msi-builder/releases/download/v1.2.0/msi-builder_1.2.0_windows_amd64.zip -OutFile target/windows-package/msi-builder.zip
          $hash = (Get-FileHash target/windows-package/msi-builder.zip -Algorithm SHA256).Hash
          if ($hash -ne 'd528277ae68218335318e8f335c01bdbfaa89882ffa53625251ad3e70c7735a7') { throw 'MSI compiler digest mismatch' }
          Expand-Archive target/windows-package/msi-builder.zip target/msi-builder
      - name: Validate and build MSI with default payload read-back
        env:
          APP_VERSION: ${{ steps.identity.outputs.version }}
          MSI_NAME: ${{ steps.identity.outputs.name }}
        run: |
          target/msi-builder/msi-builder.exe validate --var "VERSION=$env:APP_VERSION" deploy/desktop/windows/msi.yaml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          target/msi-builder/msi-builder.exe build --var "VERSION=$env:APP_VERSION" -o "target/windows-package/delivery/$env:MSI_NAME" deploy/desktop/windows/msi.yaml
      # Future MSI signing and signature verification belong here. Then inspect
      # and hash the final signed bytes, never mutate an already hashed MSI.
      - name: Locate standard Windows SDK dependency inspection
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe'
          if ($LASTEXITCODE -or -not $dumpbin) { throw 'Windows dependency inspection tool unavailable' }
          (Split-Path ($dumpbin | Select-Object -Last 1)) >> $env:GITHUB_PATH
      - name: Inspect package and native dependencies
        env:
          MSI_NAME: ${{ steps.identity.outputs.name }}
          APP_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          target/msi-builder/msi-builder.exe inspect "target/windows-package/delivery/$env:MSI_NAME"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = 'target/x86_64-pc-windows-msvc/release/clacks-log.exe'
          $version = (Get-Item $exe).VersionInfo
          if ($version.FileVersion -ne $env:APP_VERSION -or $version.ProductVersion -ne $env:APP_VERSION) { throw 'Executable version differs from Cargo version' }
          $version | Select-Object FileVersion,ProductVersion,ProductName,CompanyName | ConvertTo-Json
          dumpbin /dependents $exe
      - name: Record final checksum and build evidence
        env:
          MSI_NAME: ${{ steps.identity.outputs.name }}
        run: |
          $delivery = 'target/windows-package/delivery'
          $hash = (Get-FileHash "$delivery/$env:MSI_NAME" -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadata = Get-Content target/windows-package/metadata.json -Raw | ConvertFrom-Json
          $ci = $null
          if ($env:GITHUB_EVENT_NAME -eq 'push') { $ci = Get-Content target/windows-package/ci-evidence.json -Raw | ConvertFrom-Json }
          @{
            application = $metadata
            artifact = $env:MSI_NAME
            sha256 = $hash
            reused_ci = $ci
            runner = "$env:RUNNER_OS/$env:RUNNER_ARCH"
            image = "$env:ImageOS/$env:ImageVersion"
            workflow_run = $env:GITHUB_RUN_ID
            workflow_attempt = $env:GITHUB_RUN_ATTEMPT
            native_acceptance = 'not established by packaging; see issue #79'
          } | ConvertTo-Json -Depth 10
          @(
            '### Windows installer',
            '',
            "- Installer: $env:MSI_NAME",
            "- Version: $($metadata.version)",
            "- Source commit: $($metadata.revision)",
            "- SHA-256: $hash",
            "- Signing: $($metadata.signing_mode)",
            "- Runner image: $env:ImageOS/$env:ImageVersion",
            '',
            'Build diagnostics and reused verification results are in the job logs.'
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: target/windows-package/delivery/${{ steps.identity.outputs.name }}
          if-no-files-found: error

  draft:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windows-installer-draft-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: target/windows-package/delivery
      - name: Create unpublished release with installer
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
          MSI_NAME: ${{ needs.package.outputs.msi }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh release create "$GITHUB_REF_NAME" "target/windows-package/delivery/$MSI_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease="$PRERELEASE" --latest=false --title "Clacks Log $GITHUB_REF_NAME" --notes "Unsigned Windows installer. Test the attached installer before publishing. Source: $GITHUB_SHA. Build identity, checksum and diagnostics: $BUILD_URL; native Windows acceptance remains to be recorded in issue #79."
