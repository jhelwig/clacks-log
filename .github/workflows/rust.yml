name: Rust

on:
  push:
    branches:
      - main
    paths:
      - '.gitattributes'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'lib/**'
      - 'bin/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - '.gitattributes'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'lib/**'
      - 'bin/**'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve repository Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test workspace and native filesystem behavior
        run: cargo test --workspace --all-targets --locked --offline
      - name: Test documentation
        run: cargo test --workspace --doc --locked --offline
      - name: Check idiomatic Rust
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Build public and private documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked --offline
