name: Rust

on:
  push:
    branches:
      - main
    paths:
      - '.gitattributes'
      - '.sqlx/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'lib/**'
      - 'bin/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - '.gitattributes'
      - '.sqlx/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'lib/**'
      - 'bin/**'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve repository Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Rust dependency artifacts and installed tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Include the installed tool's version/features alongside the action's
          # automatic OS, architecture, compiler, manifest and lockfile keys.
          key: sqlx-cli-0.9.0-sqlite
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Install pinned SQLx metadata tooling
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features sqlite
      - name: Verify client-store SQL metadata against production migrations
        shell: bash
        env:
          SQLX_OFFLINE: 'false'
          DATABASE_URL: sqlite://clacks-query-check.sqlite
        run: |
          cargo sqlx database create
          cargo sqlx migrate run --source lib/clacks-client-store/migrations
          # Keep metadata at the workspace root; compile only its owning crate.
          cargo sqlx prepare --check --workspace -- --package clacks-client-store --all-targets --locked --offline
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Compile workspace applications and tests
        run: cargo build --workspace --all-targets --timings --locked --offline
      - name: Verify desktop command-line startup without a display
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            target/debug/clacks-log.exe --help
          else
            target/debug/clacks-log --help
          fi
      - name: Test workspace
        run: cargo test --workspace --all-targets --locked --offline
      - name: Test documentation
        run: cargo test --workspace --doc --locked --offline
      - name: Check idiomatic Rust
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Build public and private documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked --offline
      - name: Preserve Cargo build timing reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-timings-${{ matrix.os }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
