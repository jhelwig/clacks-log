name: Rust

on:
  push:
    branches:
      - main
    paths:
      - '.gitattributes'
      - '.sqlx/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'lib/**'
      - 'bin/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - '.gitattributes'
      - '.sqlx/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'lib/**'
      - 'bin/**'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve repository Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Install pinned SQLx metadata tooling
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features sqlite
      - name: Verify checked SQL metadata against production migrations
        shell: bash
        env:
          SQLX_OFFLINE: 'false'
          DATABASE_URL: sqlite://clacks-query-check.sqlite
        run: |
          cargo sqlx database create
          cargo sqlx migrate run --source lib/clacks-client-store/migrations
          cargo sqlx prepare --check --workspace -- --all-targets
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Verify desktop command-line startup without a display
        run: cargo run --bin clacks-log --locked --offline -- --help
      - name: Test workspace and native filesystem behavior
        run: cargo test --workspace --all-targets --locked --offline
      - name: Test documentation
        run: cargo test --workspace --doc --locked --offline
      - name: Check idiomatic Rust
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Build public and private documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked --offline
