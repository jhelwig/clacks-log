name: Rust

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: [self-hosted, Linux, X64, clacks-linux]
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify documentation-only pull requests
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # Write the complete diff first so a Git failure cannot look empty.
            # Disable rename folding: moving code into docs still changes code.
            git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            if [[ -s "$RUNNER_TEMP/ci-changed-paths" ]]; then
              docs_only=true
              while IFS= read -r -d '' path; do
                case "$path" in
                  README.md|CONTRIBUTING.md|SECURITY.md|AGENTS.md|LICENSE|NOTICE|*/README.md|*/AGENTS.md|docs/*.md|references/*.md) ;;
                  *) docs_only=false ;;
                esac
              done < "$RUNNER_TEMP/ci-changed-paths"
            fi
          fi
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
          printf 'Documentation-only PR: `%s`. Main pushes always require verification.\n' "$docs_only" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: changes
    # Keep executable PR work on this runner limited to same-repository branches.
    if: >-
      needs.changes.outputs.docs_only == 'false' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        # Windows verification is temporarily deferred due to CI runtime cost.
        os: [ubuntu-latest]
    runs-on: [self-hosted, Linux, X64, clacks-linux]
    services:
      postgres:
        image: postgres@sha256:b994732fcf33f73776c65d3a5bf1f80c00120ba5007e8ab90307b1a743c1fc16
        env:
          POSTGRES_DB: clacks
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clacks"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Retain file/line backtraces without full debugger data in every test
      # executable. Keep ordinary local development profiles unchanged.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      SQLX_OFFLINE: 'true'
      LEPTOS_OUTPUT_NAME: clacks-web
      CLACKS_TEST_DATABASE_URL: postgres://clacks_migrator@127.0.0.1:5432/clacks
      CLACKS_TEST_RUNTIME_DATABASE_URL: postgres://clacks_runtime@127.0.0.1:5432/clacks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use persistent local Cargo build artifacts
        run: printf 'CARGO_TARGET_DIR=%s\n' "$(dirname "$GITHUB_WORKSPACE")/target" >> "$GITHUB_ENV"
      - name: Resolve repository Rust toolchain
        run: rustup show active-toolchain
      - name: Install pinned Cargo manifest sorter
        run: cargo install cargo-sort --version 2.1.4 --locked
      - name: Check Cargo manifest organization
        run: cargo sort --workspace --check --check-format
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Install pinned SQLx metadata tooling
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features sqlite,postgres,rustls
      - name: Prepare PostgreSQL roles and release-managed schema
        shell: bash
        run: |
          psql postgres://postgres@127.0.0.1:5432/clacks -v ON_ERROR_STOP=1 -f deploy/server/database-roles.sql
          psql postgres://postgres@127.0.0.1:5432/clacks -v ON_ERROR_STOP=1 -c 'ALTER DATABASE clacks OWNER TO clacks_migrator'
          printf '%s' 'postgres://clacks_migrator@127.0.0.1:5432/clacks' > "$RUNNER_TEMP/clacks-migration-url"
          cargo run -p clacks-admin --locked --offline -- database migrate --database-url-file "$RUNNER_TEMP/clacks-migration-url"
          psql postgres://clacks_migrator@127.0.0.1:5432/clacks -v ON_ERROR_STOP=1 -f deploy/server/database-grants.sql
          rm "$RUNNER_TEMP/clacks-migration-url"
      - name: Verify client-store SQL metadata against production migrations
        shell: bash
        env:
          SQLX_OFFLINE: 'false'
          DATABASE_URL: sqlite://clacks-query-check.sqlite
          CLACKS_SQLITE_DATABASE_URL: sqlite://clacks-query-check.sqlite
        run: |
          cargo sqlx database create
          cargo sqlx migrate run --source lib/clacks-client-store/migrations
          # Keep metadata at the workspace root; compile only its owning crate.
          cargo sqlx prepare --check --workspace -- --package clacks-client-store --all-targets --locked --offline
      - name: Verify server SQL metadata against production migrations
        working-directory: lib/clacks-server
        env:
          SQLX_OFFLINE: 'false'
          DATABASE_URL: postgres://clacks_migrator@127.0.0.1:5432/clacks
        run: cargo sqlx prepare --check -- --all-targets --locked --offline
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Compile workspace applications and tests
        run: |
          df -h .
          cargo build --workspace --all-targets --timings --locked --offline
      - name: Verify desktop command-line startup without a display
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$CARGO_TARGET_DIR/debug/clacks-log.exe" --help
          else
            "$CARGO_TARGET_DIR/debug/clacks-log" --help
          fi
      - name: Install pinned cargo-nextest
        shell: bash
        run: |
          nextest_dir=$(mktemp -d "$RUNNER_TEMP/nextest.XXXXXX")
          version=0.9.152
          archive="cargo-nextest-$version-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version"
          curl --proto '=https' --fail --silent --show-error --location --retry 3 \
            "$release/$archive" -o "$nextest_dir/$archive"
          (
            cd "$nextest_dir"
            printf '%s  %s\n' d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a "$archive" |
              sha256sum --check
            tar -xzf "$archive" cargo-nextest
          )
          printf '%s\n' "$nextest_dir" >> "$GITHUB_PATH"
      - name: Test workspace
        run: cargo nextest run --workspace --all-targets --locked --offline
      - name: Test documentation
        run: cargo test --workspace --doc --locked --offline
      - name: Check idiomatic Rust
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Build public and private documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked --offline
      - name: Preserve Cargo build timing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings-${{ matrix.os }}
          path: ${{ env.CARGO_TARGET_DIR }}/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Report build disk usage
        if: always()
        run: |
          df -h .
          du -sh "$CARGO_TARGET_DIR" ~/.cargo

  verify-web:
    needs: changes
    # One dedicated runner executes these jobs sequentially. Cargo keeps build
    # artifacts outside the cleaned source checkout and tracks their freshness.
    if: >-
      needs.changes.outputs.docs_only == 'false' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, clacks-linux]
    env:
      SQLX_OFFLINE: 'true'
      LEPTOS_OUTPUT_NAME: clacks-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use persistent local Cargo build artifacts
        run: printf 'CARGO_TARGET_DIR=%s\n' "$(dirname "$GITHUB_WORKSPACE")/target" >> "$GITHUB_ENV"
      - name: Resolve repository Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Install pinned Rust web build tooling
        run: |
          df -h .
          rustup target add wasm32-unknown-unknown
          cargo install cargo-leptos --version 0.3.11 --locked
      - name: Build release server and hydrated browser assets
        run: cargo leptos build --release
      - name: Report build disk usage
        if: always()
        run: |
          df -h .
          du -sh "$CARGO_TARGET_DIR" ~/.cargo

  ci-result:
    name: CI result
    needs: [changes, verify, verify-web]
    if: always()
    runs-on: [self-hosted, Linux, X64, clacks-linux]
    timeout-minutes: 5
    steps:
      - name: Require the expected verification outcomes
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          WEB_RESULT: ${{ needs.verify-web.result }}
        run: |
          printf 'Classification: %s; docs_only: %s; workspace: %s; web: %s\n' \
            "$CHANGES_RESULT" "$DOCS_ONLY" "$VERIFY_RESULT" "$WEB_RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo 'Change classification did not succeed.' >&2
            exit 1
          fi
          case "$DOCS_ONLY:$VERIFY_RESULT:$WEB_RESULT" in
            true:skipped:skipped|false:success:success) ;;
            *)
              echo 'Verification outcomes do not match the classified changes.' >&2
              exit 1
              ;;
          esac
