name: Desktop release preparation

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source revision for the desktop release
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: [self-hosted, Linux, X64, clacks-linux]
    env:
      RUST_LOG: info
    steps:
      - name: Create release preparation token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Use persistent local Cargo build artifacts
        run: printf 'CARGO_TARGET_DIR=%s\n' "$(dirname "$GITHUB_WORKSPACE")/target" >> "$GITHUB_ENV"
      - name: Build source-owned release tooling
        run: |
          cargo fetch --locked
          cargo build -p clacks-desktop-package --locked --offline
      - name: Prepare the next desktop release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          preparation=$("$CARGO_TARGET_DIR/debug/clacks-desktop-package" release-prepare --repository "$GITHUB_REPOSITORY" --request-id "$GITHUB_RUN_ID")
          version=$(jq -er .version <<< "$preparation")
          branch=$(jq -er .branch <<< "$preparation")
          if [[ $(jq -r .new_request <<< "$preparation") == true ]]; then
            cargo metadata --format-version 1 --offline > "$RUNNER_TEMP/desktop-cargo-metadata.json"
            git checkout -b "$branch"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bin/clacks-log/Cargo.toml Cargo.lock
            cat > "$RUNNER_TEMP/desktop-version-commit.txt" <<EOF_COMMIT
          Prepare desktop release $version

          Commit the desktop application version before native candidate builds.
          Keep shared library versions and sync-contract definitions unchanged.
          EOF_COMMIT
            git commit --file "$RUNNER_TEMP/desktop-version-commit.txt"
            git push origin "HEAD:refs/heads/$branch"
          fi
          pr=$(jq -r '.pull_request // empty' <<< "$preparation")
          if [[ -n "$pr" ]]; then
            printf 'Existing release preparation: %s\n' "$pr"
          else
            cat > "$RUNNER_TEMP/desktop-version-pr.md" <<EOF_PR
          Prepare desktop release $version.

          Set the desktop application version and its lockfile entry so the
          merged source can be tagged and packaged automatically after normal
          main-branch verification. Shared library versions are unchanged.
          EOF_PR
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Prepare desktop release $version" --body-file "$RUNNER_TEMP/desktop-version-pr.md"
          fi
