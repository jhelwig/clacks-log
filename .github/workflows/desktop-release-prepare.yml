name: Desktop release preparation

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source revision for the desktop release
        required: true
        default: main
        type: string
      version:
        description: Desktop release version (YY.M.N)
        required: true
        type: string
  workflow_run:
    workflows: [Rust]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_LOG: info
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source }}
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop-release-preparation
      - name: Build source-owned release tooling
        run: |
          cargo fetch --locked
          cargo build -p clacks-desktop-package --locked --offline
      - name: Continue a merged release request
        if: github.event_name == 'workflow_run'
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: target/debug/clacks-desktop-package release-continue --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA"
      - name: Prepare desktop version or start an already prepared release
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          source_sha=$(git rev-parse HEAD)
          preparation=$(target/debug/clacks-desktop-package release-version --manifest bin/clacks-log/Cargo.toml --version "$RELEASE_VERSION")
          if [[ $(jq -r .changed <<< "$preparation") == true ]]; then
            cargo metadata --format-version 1 --offline > "$RUNNER_TEMP/desktop-cargo-metadata.json"
            branch=$(jq -er .branch <<< "$preparation")
            git checkout -b "$branch"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bin/clacks-log/Cargo.toml Cargo.lock
            cat > "$RUNNER_TEMP/desktop-version-commit.txt" <<EOF_COMMIT
          Prepare desktop release $RELEASE_VERSION

          Commit the desktop application version before native candidate builds.
          Keep shared library versions and sync-contract definitions unchanged.
          EOF_COMMIT
            git commit --file "$RUNNER_TEMP/desktop-version-commit.txt"
            git push origin "HEAD:refs/heads/$branch"
            cat > "$RUNNER_TEMP/desktop-version-pr.md" <<EOF_PR
          Prepare desktop release $RELEASE_VERSION from source $source_sha.

          Set the desktop application version and its lockfile entry so the
          merged source can be tagged and packaged automatically after normal
          main-branch verification. Shared library versions are unchanged.
          EOF_PR
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Prepare desktop release $RELEASE_VERSION" --body-file "$RUNNER_TEMP/desktop-version-pr.md"
          else
            target/debug/clacks-desktop-package release-start --repository "$GITHUB_REPOSITORY" --revision "$source_sha"
          fi
