[workspace]
members = ["lib/clacks-model", "lib/clacks-sync"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Elastic-2.0"
publish = false

[workspace.dependencies]
clacks-model = { path = "lib/clacks-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ulid = "3"
thiserror = "2"
anyhow = "1"

time = { version = "0.3", features = ["formatting"] }
deunicode = "1"
