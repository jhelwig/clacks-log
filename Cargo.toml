[workspace]
members = [
    "lib/clacks-web",
    "lib/clacks-server",
    "bin/clacks-admin",
    "bin/clacks-server",
    "lib/clacks-client-store",
    "lib/clacks-desktop",
    "lib/clacks-geography",
    "lib/clacks-geography-builder",
    "bin/clacks-geography-build",
    "lib/clacks-model",
    "lib/clacks-sync",
    "lib/clacks-lotw",
    "lib/clacks-reference-data",
    "bin/clacks-lotw-data",
    "bin/clacks-account-data",
    "bin/clacks-log",

    "bin/clacks-lotw-fixtures",
]
resolver = "3"
exclude = ["vendor/oauth-as"]

[patch.crates-io]
oauth-as = { path = "vendor/oauth-as" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Elastic-2.0"
publish = false

[workspace.dependencies]
shlex = "2.0.1"
oauth-as = { version = "=1.0.0", default-features = false, features = ["dpop", "jwt-p256", "http"] }
huskarl = { version = "=0.11.9", features = ["authorization-flow-loopback", "tracing"] }
huskarl-core = "=0.10.10"
huskarl-crypto-native = "=0.11.3"
huskarl-reqwest = { version = "=0.9.3", features = ["rustls-tls"] }
huskarl-resource-server = "=0.11.12"
keyring-core = "=1.0.1"
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
reqwest-oauth = { package = "reqwest", version = "=0.13.5", default-features = false, features = ["rustls", "json", "query"] }
fluent-uri = "=0.4.1"
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
zeroize = { version = "=1.9.1", features = ["derive"] }
leptos = { version = "=0.8.22", default-features = false }
leptos_axum = "=0.8.10"
leptos_meta = "0.8"
leptos_router = "0.8"
wasm-bindgen = "0.2"
clacks-web = { path = "lib/clacks-web" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
axum_session = "=0.22.0"
axum_session_sqlx = { version = "=0.12.0", default-features = false, features = ["postgres", "tls-rustls"] }
tower-http = { version = "0.7", features = ["trace", "fs"] }
chrono = "0.4"
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
axum = { version = "=0.8.9", features = ["form", "query"] }
clacks-server = { path = "lib/clacks-server" }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "persistence", "system_fonts", "wgpu", "wayland", "x11"] }
egui_extras = { version = "=0.37.0", default-features = false }
egui_kittest = { version = "=0.37.0", default-features = false }
fontique = "=0.11.1"
clacks-desktop = { path = "lib/clacks-desktop" }
config = { version = "=0.15.27", default-features = false, features = ["toml"] }
directories = "=6.0.0"
url = "2"
http = "1"
tracing-appender = "=0.2.5"
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "logs", "internal-logs"] }
opentelemetry-http = "=0.33.1"
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "logs", "internal-logs"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "metrics", "logs", "internal-logs"] }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
opentelemetry-appender-tracing = { version = "=0.33.1", default-features = false }
metrics-opentelemetry = { version = "=0.24033.1", default-features = false }
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
prost = "=0.14.1"
interprocess = { version = "=2.4.7", features = ["tokio"] }
tokio-util = { version = "=0.7.16", features = ["rt"] }
libc = "=0.2.191"
windows-sys = "=0.61.2"
widestring = "=1.2.1"
sha2 = "=0.11.1"
percent-encoding = "2"
clacks-client-store = { path = "lib/clacks-client-store" }
clacks-sync = { path = "lib/clacks-sync" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "macros", "migrate"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "sync", "time"] }
clacks-geography = { path = "lib/clacks-geography" }
clacks-geography-builder = { path = "lib/clacks-geography-builder" }
shapefile = { version = "=0.9.0", features = ["geo-types"] }
geojson = { version = "0.24", features = ["geo-types"] }
proj4rs = { version = "=0.2.1", default-features = false, features = ["tiff"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
geo = { version = "=0.33.1", default-features = false }
geo-types = { version = "0.7.19", features = ["serde"] }
clipper2-rust = { version = "=1.2.0", default-features = false }
flatgeobuf = { version = "=6.0.1", default-features = false }
geozero = { version = "=0.15.1", default-features = false, features = ["with-geo"] }
tempfile = "3"
clacks-reference-data = { path = "lib/clacks-reference-data" }
roxmltree = "0.21.1"
clacks-model = { path = "lib/clacks-model" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
regex = "1"
winnow = "=1.0.3"
num-bigint = "=0.4.8"
num-integer = "=0.1.47"
ulid = { version = "3", features = ["serde"] }
thiserror = "2"
anyhow = "1"

time = { version = "0.3", features = ["formatting", "parsing"] }
deunicode = "1"

tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
metrics = "0.24.6"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry"] }
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }

x509-parser = { version = "=0.18.1", default-features = false }

p12-keystore = { version = "=0.4.1", default-features = false, features = ["pbes1"] }
rsa = "=0.9.10"
sha1 = { version = "=0.10.7", features = ["oid"] }
der = { version = "0.8", features = ["std"] }
pkcs12 = "=0.2.0-pre.0"
rand = "0.8"
base64 = "0.22"

# Rust-only fixture construction uses the archive and signing dependency families
# through encoded bytes, without calling production import/signing operations.
rand_chacha = "0.3.1"
sha2-rsa = { package = "sha2", version = "0.10.9", features = ["oid"] }
sha1-archive = { package = "sha1", version = "0.11" }
sha2-archive = { package = "sha2", version = "0.11" }
hmac = "0.13"
pkcs5 = { version = "0.8", features = ["alloc", "pbes2"] }
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
des = "0.9"
rc2 = "0.9"
hex = "0.4"

[[workspace.metadata.leptos]]
name = "clacks-web"
bin-package = "clacks-server-app"
bin-target = "clacks-server"
bin-exe-name = "clacks-server"
lib-package = "clacks-web"
output-name = "clacks-web"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "lib/clacks-web/style/account.css"
bin-features = ["ssr"]
bin-default-features = false
bin-cargo-args = ["--locked"]
lib-features = ["hydrate"]
lib-default-features = false
lib-cargo-args = ["--locked"]
