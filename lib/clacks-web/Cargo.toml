[package]
name = "clacks-web"
autotests = false
description = "Clacks account pages and browser hydration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ssr = ["leptos/ssr", "dep:leptos_axum", "dep:clacks-server", "dep:axum", "dep:axum_session_sqlx"]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen"]

[dependencies]
leptos.workspace = true
leptos_router.workspace = true
leptos_meta.workspace = true
serde.workspace = true
leptos_axum = { workspace = true, optional = true }
clacks-server = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
axum_session_sqlx = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
huskarl-core.workspace = true
huskarl-crypto-native.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
reqwest = { workspace = true, features = ["cookies", "json"] }
tempfile.workspace = true
serde_json.workspace = true
openidconnect.workspace = true
rsa.workspace = true
rand.workspace = true
ulid.workspace = true
chrono.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["ssr"]
