[package]
name = "clacks-web"
autotests = false
description = "Clacks account pages and browser hydration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ssr = [
    "dep:clacks-sync",
    "leptos/ssr",
    "dep:leptos_axum",
    "dep:clacks-server",
    "dep:axum",
    "dep:axum_session_sqlx",
]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dependencies]
axum = { workspace = true, optional = true }
axum_session_sqlx = { workspace = true, optional = true }
clacks-model.workspace = true
clacks-server = { workspace = true, optional = true }
clacks-sync = { workspace = true, optional = true }
leptos.workspace = true
leptos_axum = { workspace = true, optional = true }
leptos_meta.workspace = true
leptos_router.workspace = true
serde.workspace = true
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
anyhow.workspace = true
chrono.workspace = true
huskarl-core.workspace = true
huskarl-crypto-native.workspace = true
openidconnect.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["cookies", "json"] }
rsa.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
ulid.workspace = true
url.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["ssr"]

[lints]
workspace = true
