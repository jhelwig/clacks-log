[package]
name = "clacks-server"
description = "Clacks account services and server application operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clacks-model.workspace = true
sqlx = { workspace = true, features = ["postgres", "time", "tls-rustls"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
time.workspace = true
ulid.workspace = true
rand.workspace = true
base64.workspace = true
thiserror.workspace = true
tracing.workspace = true
clap.workspace = true

openidconnect.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
url = { workspace = true, features = ["serde"] }
config.workspace = true
tempfile.workspace = true

axum_session.workspace = true
axum_session_sqlx.workspace = true
tower-http.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
metrics.workspace = true
