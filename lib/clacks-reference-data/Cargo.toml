[package]
name = "clacks-reference-data"
description = "Maintain LoTW reference data and reproducible synthetic fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clacks-model.workspace = true

serde.workspace = true
serde_json.workspace = true
regex.workspace = true
roxmltree.workspace = true
tracing.workspace = true

rsa = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
sha2-rsa = { workspace = true, optional = true }
sha1-archive = { workspace = true, optional = true }
sha2-archive = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
pkcs5 = { workspace = true, optional = true }
pkcs12 = { workspace = true, optional = true, features = ["kdf"] }
der = { workspace = true, optional = true }
cbc = { workspace = true, optional = true }
des = { workspace = true, optional = true }
rc2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[features]
fixtures = [
    "dep:rsa",
    "dep:sha1",
    "dep:rand",
    "dep:rand_chacha",
    "dep:sha2-rsa",
    "dep:sha1-archive",
    "dep:sha2-archive",
    "dep:hmac",
    "dep:pkcs5",
    "dep:pkcs12",
    "dep:der",
    "dep:cbc",
    "dep:des",
    "dep:rc2",
    "dep:hex",
    "dep:base64",
]

[lints]
workspace = true
