[workspace]
members = ["bin/*", "lib/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "Elastic-2.0"

[workspace.dependencies]
dependency-policy = { path = "lib/dependency-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
