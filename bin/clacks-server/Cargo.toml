[package]
name = "clacks-server-app"
description = "Clacks Log server application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "clacks-server"
path = "src/main.rs"
# The library owns API documentation; this thin command supplies --help.
doc = false

[features]
ssr = []

[dependencies]
anyhow.workspace = true
axum.workspace = true
clacks-server.workspace = true
clacks-web = { workspace = true, features = ["ssr"] }
clap.workspace = true
leptos.workspace = true
opentelemetry.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true

[lints]
workspace = true
