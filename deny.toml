# Check the complete resolved graph, including optional features and all targets.
[advisories]
unmaintained = "all"
# CI overrides only the unmaintained diagnostic to warnings, then applies the
# base-aware direct-dependency gate. Other vulnerabilities remain errors.

# Only this reviewed dependent/version may introduce affected RSA. New RSA
# dependents and OpenID Connect upgrades require another assessment.
# Full source assessment: docs/development.md#remaining-rsa-advisory
[[advisories.ignore]]
id = "RUSTSEC-2023-0071"
allow = ["openidconnect@4.1.0"]
reason = """
Production OpenID Connect verifies provider signatures with public RSA keys;
it performs no RSA private signing or decryption. CoreRsaPrivateSigningKey is
used only by the loopback test provider with ephemeral test keys. Direct LoTW
signing and Huskarl use patched RSA 0.10. Reassess on OpenID Connect usage or
version changes; this exception does not establish that RSA 0.9 is fixed.
"""

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.95
include-dev = true

